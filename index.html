<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Animation Library — Jeremy Tarnopol</title>
<meta name="description" content="A live, tunable catalog of UI motion: navigation transitions, content choreography, micro-interactions, scroll effects and signature moves. Each entry is a running demo with copy-paste code for framer-motion, CSS/WAAPI and GSAP.">
<link rel="stylesheet" href="css/playground.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/CustomEase.min.js"></script>
</head>
<body>
  <button class="menu-btn" id="menuBtn" aria-label="Open catalog">☰</button>
  <aside id="sidebar">
    <div class="side-head">
      <h1>Animation Library</h1>
      <div class="tag">Live, tunable motion catalog · <a href="https://github.com/Jerms-AI/animation-playground" target="_blank" rel="noopener">GitHub</a></div>
    </div>
    <nav id="nav"></nav>
    <div class="side-foot">
      <a href="https://cybercanvascollective.art/motion/" target="_blank" rel="noopener">Motion Demos →</a>
      <a href="https://github.com/Jerms-AI" target="_blank" rel="noopener">Jerms-AI</a>
    </div>
  </aside>

  <main>
    <div class="head">
      <p class="group" id="group">—</p>
      <h2 id="title">—</h2>
      <p id="desc">—</p>
      <p class="source" id="source" hidden></p>
    </div>

    <div class="stage-wrap">
      <div class="stage" id="stage"></div>
      <div class="controls" id="controls"></div>
      <div class="row">
        <button class="btn" id="playFwd">▶ Play</button>
        <button class="btn ghost" id="playBack">◀ Reverse</button>
        <label class="toggle"><input type="checkbox" id="loop" /> loop</label>
        <span class="kbd-hint">space = play · ⇧space = reverse</span>
      </div>
    </div>

    <div class="notes" id="notes" hidden>
      <h3>Mechanism</h3>
      <div id="notesBody"></div>
    </div>

    <div class="code-wrap">
      <div class="code-head">
        <div class="tabs" id="tabs"></div>
        <button class="copy" id="copyBtn">Copy</button>
      </div>
      <pre id="code"></pre>
    </div>
  </main>

  <script src="js/framework.js"></script>
  <script src="catalog/navigation.js"></script>
  <script src="catalog/content.js"></script>
  <script src="catalog/micro.js"></script>
  <script src="catalog/scroll.js"></script>
  <script src="catalog/signature.js"></script>
  <script>Playground.boot();</script>
</body>
</html>
